<section class="acet-conference-footer-section">
  <div class="acet-conference-footer-container">
    <div class="acet-conference-footer-brand">
      <img
        class="acet-conference-footer-logo"
        src="https://www.idri.edu.kh/wp-content/uploads/2026/05/ACET2026-logo-w.png"
        alt="ACET 2026"
      />

      <p class="acet-conference-footer-description">
        Join us at ACET 2026 to connect and<br />
        to shape ASEAN’s digital future.
      </p>
    </div>

    <div class="acet-conference-footer-column">
      <h2 class="acet-conference-footer-title">Previous Conferences</h2>
      <div class="acet-conference-footer-list" id="acet-conference-footer-list"></div>
    </div>

    <div class="acet-conference-footer-column">
      <h2 class="acet-conference-footer-title">Contact</h2>
      <div class="acet-conference-footer-contact" id="acet-conference-footer-contact"></div>
    </div>
  </div>
</section>

<style>
  .acet-conference-footer-section {
    width: 100%;
    color: #ffffff;
  }

  .acet-conference-footer-container {
    width: 100%;
    max-width: 100%;
    display: grid;
    grid-template-columns: 1fr 0.95fr 1.15fr;
    gap: 46px;
    align-items: start;
  }

  .acet-conference-footer-logo {
    width: 200px;
    height: auto;
    display: block;
    margin-bottom: 20px;
  }

  .acet-conference-footer-description {
    margin: 0;
    color: #ffffff !important;
    font-size: 16px;
    line-height: 1.7;
    letter-spacing: 0;
    font-weight: 500;
  }

  .acet-conference-footer-title {
    margin: 0 0 24px;
    color: #ff4438 !important;
    font-size: 24px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: 0;
  }

  .acet-conference-footer-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 0;
    padding: 0;
  }

  .acet-conference-footer-link {
    display: inline-block;
    color: #ffffff !important;
    font-size: 16px;
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: 0;
    text-decoration: none;
    transition: color 180ms ease, transform 180ms ease;
  }

  .acet-conference-footer-link:hover {
    color: #ff4438 !important;
    transform: translateX(4px);
  }

  .acet-conference-footer-contact {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .acet-conference-footer-contact-item {
    margin: 0;
    color: #ffffff !important;
    font-size: 16px;
    line-height: 1.55;
    letter-spacing: 0;
    font-weight: 500;
  }

  .acet-conference-footer-contact-label {
    font-weight: 600;
  }

  .acet-conference-footer-contact-link {
    color: #00a3ff !important;
    text-decoration: underline;
  }

  @media (max-width: 760px) {
    .acet-conference-footer-container {
      grid-template-columns: 1fr;
      gap: 34px;
      text-align: center;
    }

    .acet-conference-footer-logo {
      margin: 0 auto 16px;
    }

    .acet-conference-footer-description,
    .acet-conference-footer-link,
    .acet-conference-footer-contact-item {
      font-size: 16px;
    }

    .acet-conference-footer-title {
      margin-bottom: 18px;
      font-size: 24px;
    }

    .acet-conference-footer-list,
    .acet-conference-footer-contact {
      gap: 8px;
      align-items: center;
    }

    .acet-conference-footer-link:hover {
      transform: none;
    }
  }

  @media (max-width: 425px) {
    .acet-conference-footer-container {
      gap: 28px;
    }

    .acet-conference-footer-logo {
      width: 150px;
    }

    .acet-conference-footer-description,
    .acet-conference-footer-link,
    .acet-conference-footer-contact-item {
      font-size: 14px;
    }

    .acet-conference-footer-title {
      margin-bottom: 16px;
      font-size: 20px;
    }

    .acet-conference-footer-list,
    .acet-conference-footer-contact {
      gap: 6px;
    }
  }
</style>

<script>
  const acetConferenceFooterData = {
    previousConferences: [
      {
        label: "ACET 2025",
        url: "https://www.idri.edu.kh/events/acet-2025/"
      },
      {
        label: "ACET 2024",
        url: "https://www.idri.edu.kh/events/acet-2024/"
      },
      {
        label: "ACET 2023",
        url: "https://www.idri.edu.kh/events/acet-2023/"
      },
      {
        label: "ACET 2022",
        url: "https://acet22.cadt.edu.kh/"
      }
    ],
    contact: {
      email: "acet@cadt.edu.kh",
      phone: "+855 10 340 000",
      address:
        "National Road 6A, Kthor, Prek Leap Chroy Changvar, Phnom Penh, Cambodia"
    }
  };

  const acetConferenceFooterList = document.getElementById(
    "acet-conference-footer-list"
  );
  const acetConferenceFooterContact = document.getElementById(
    "acet-conference-footer-contact"
  );

  function acetConferenceFooterRender(data) {
    acetConferenceFooterList.innerHTML = "";
    acetConferenceFooterContact.innerHTML = "";

    data.previousConferences.forEach((item) => {
      const link = document.createElement("a");
      link.className = "acet-conference-footer-link";
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = item.label;

      acetConferenceFooterList.appendChild(link);
    });

    acetConferenceFooterContact.innerHTML = `
      <p class="acet-conference-footer-contact-item">
        <span class="acet-conference-footer-contact-label">Email:</span>
        <a
          class="acet-conference-footer-contact-link"
          href="mailto:${data.contact.email}"
        >
          ${data.contact.email}
        </a>
      </p>

      <p class="acet-conference-footer-contact-item">
        <span class="acet-conference-footer-contact-label">Phone:</span>
        ${data.contact.phone}
      </p>

      <p class="acet-conference-footer-contact-item">
        <span class="acet-conference-footer-contact-label">Address:</span>
        ${data.contact.address}
      </p>
    `;
  }

  acetConferenceFooterRender(acetConferenceFooterData);
</script>
