<style>

.researcher-profile-container {
  max-width: 100%;
  margin: auto;
  padding: 20px 0px;
}

.researcher-profile-profile-card {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 40px;
  align-items: start;
}

.researcher-profile-profile-image img {
  width: 100%;
}

.researcher-profile-profile-content {
  max-width: 700px;
}

.researcher-profile-profile-content h1 {
  font-size: 32px;
  margin-bottom: 10px;
  font-weight: bold;
}

.researcher-profile-profile-content h3 {
  font-size: 20px;
  color: #12284C;
  margin-bottom: 20px;
}

.researcher-profile-profile-content p {
  font-size: 16px;
  line-height: 1.7;
  color: #12284C;
  margin-bottom: 25px;
}

.researcher-profile-contact {
  display: flex;
  justify-content: space-evenly;
  border: 1px solid #ddd;
  padding: 15px 20px;
  background: #fafafa;
  margin-top: 20px;
}

.researcher-profile-contact-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.researcher-profile-icon {
  color: #e63946;
}

/* Responsive */
@media (max-width: 768px) {
  .researcher-profile-profile-card {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .researcher-profile-profile-image {
    max-width: 250px;
    margin: auto;
  }

  .researcher-profile-contact {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<section class="researcher-profile-profile">
  <div class="researcher-profile-container" id="profileContainer"></div>
</section>

<script>
// 🔹 Dynamic Data (can come from API later)
const profileData = {
  name: "Dr. Ly Rottana",
  title: "Director of Digital Research and Development Center",
  description: `Dr. Ly Rottana is a Cambodian computer science researcher and lecturer
  specializes in artificial intelligence, machine learning, and computer vision,
  and earned his PhD in Computer Science from the University of Grenoble Alpes
  in France in 2023. Before that, he studied in Cambodia and France and has been
  teaching and researching since 2017.`,
  email: "rottana.ly@cadt.edu.kh",
  location: "CADT, Innovation Center, 3rd Floor, Room: F311",
  image: "https://www.idri.edu.kh/wp-content/uploads/2026/04/Dr.Ly_.png"
};

// 🔹 Render Function
function renderProfile(data) {
  const container = document.getElementById("profileContainer");

  container.innerHTML = `
    <div class="researcher-profile-profile-card">
      
      <div class="researcher-profile-profile-image">
        <img src="${data.image}" alt="${data.name}">
      </div>

      <div class="researcher-profile-profile-content">
        <h1>${data.name}</h1>
        <h3>${data.title}</h3>
        <p>${data.description}</p>

      </div>

    </div>

    <div class="researcher-profile-contact">
      <div class="researcher-profile-contact-item">
        <span class="researcher-profile-icon">✉</span>
        <span>${data.email}</span>
      </div>
      <div class="researcher-profile-contact-item">
        <span class="researcher-profile-icon">📍</span>
        <span>${data.location}</span>
      </div>
    </div>
  `;
}

// 🔹 Initialize
renderProfile(profileData);
</script>
