<style>
:root{
  --green: #76BC21;
  --navy: #12284C;
}

/* =========================
   Header
========================= */
.rfs-header{
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  background: #fff;
  z-index: 999;
  transition: box-shadow .3s ease;
}

.rfs-header.scrolled{
  box-shadow: 0px 4px 48px 10px rgba(0,0,0,.15);
}

/* Container */
.rfs-header__container{
  max-width: 1250px;
  margin: auto;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Logo */
.rfs-header__logo img{
  height: 52px;
  display: block;
}

/* Desktop Nav */
.rfs-header__nav{
  display: flex;
  align-items: center;
  gap: 40px;
}

.rfs-header__nav a{
  text-decoration: none !important;
  color: var(--navy);
  font-weight: 600;
  font-size: 16px;
  transition: color .25s ease, opacity .25s ease;
}

.rfs-header__nav a:hover{ color:var(--green); }
.rfs-header__nav a.active{ color:var(--green); }

/* Ticket button (desktop + mobile) */
.btn-ticket{
  background: var(--green);
  color: #fff !important;
  padding: 10px 18px;
}
.btn-ticket:hover{ opacity:.9; }

/* =========================
   Hamburger (hidden desktop)
========================= */
.rfs-menu-btn{
  display: none;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(18,40,76,.15);
  border-radius: 10px;
  background:#fff;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.rfs-menu-btn:focus{ outline:2px solid rgba(118,188,33,.35); outline-offset:2px; }

.rfs-menu-icon{
  width: 20px; height: 14px;
  position: relative;
}
.rfs-menu-icon span{
  position: absolute;
  left: 0;
  width: 100%;
  height: 2px;
  background:var(--navy);
  border-radius: 2px;
  transition:transform .25s ease, top .25s ease, opacity .25s ease;
}
.rfs-menu-icon span:nth-child(1){ top:0; }
.rfs-menu-icon span:nth-child(2){ top:6px; }
.rfs-menu-icon span:nth-child(3){ top:12px; }

/* X state */
.rfs-menu-btn[aria-expanded="true"] .rfs-menu-icon span:nth-child(1){ top:6px; transform:rotate(45deg); }
.rfs-menu-btn[aria-expanded="true"] .rfs-menu-icon span:nth-child(2){ opacity:0; }
.rfs-menu-btn[aria-expanded="true"] .rfs-menu-icon span:nth-child(3){ top:6px; transform:rotate(-45deg); }

/* =========================
   Mobile Dropdown
========================= */
.rfs-mobile-nav{
  display: none;
  background: #fff;
  border-top: 1px solid rgba(18,40,76,.08);
}
.rfs-mobile-nav.open{ display:block; }

.rfs-mobile-nav__inner{
  max-width: 1440px;
  margin: auto;
  padding: 14px 24px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rfs-mobile-nav a{
  text-decoration: none !important;
  color: var(--navy);
  font-weight:600;
  font-size:15px;
  padding: 10px 6px;
}
.rfs-mobile-nav a:hover{ color:var(--green); }
.rfs-mobile-nav a.active{ color:var(--green); }

.rfs-mobile-nav .btn-ticket{
  width: fit-content;
  padding: 10px 16px;
  margin-top: 6px;
}

/* =========================
   Responsive
========================= */
@media (max-width: 1024px){
  .rfs-header__container{ padding: 16px 24px; }
  .rfs-header__nav{ gap: 20px; }
}

@media (max-width: 768px){
  .rfs-header__nav{ display:none; }
  .rfs-menu-btn{ display:inline-flex; }
  .rfs-header__logo img{ height: 44px; }
}

/* Optional: prevent content hiding behind fixed header */
body{ padding-top: 84px; }
@media (max-width: 768px){ body{ padding-top: 76px; } }
</style>

<header class="rfs-header" id="rfsHeader">
  <div class="rfs-header__container">
    <!-- Logo -->
    <a class="rfs-header__logo" href="#">
      <img src="http://cadt.edu.kh/wp-content/uploads/2026/02/Run-for-Smile-Logo-Small.png" alt="Run For Smile">
    </a>

    <!-- Desktop Navigation -->
    <nav class="rfs-header__nav" aria-label="Primary">
      <a href="#home" class="active">Home</a>
      <a href="#map">Map</a>
      <a href="#bags-of-smile">Bags of Smile</a>
      <a href="#partners">Partners</a>
      <a href="#sponsors">Sponsors</a>
      <a href="#" class="btn-ticket">Get Ticket Now</a>
    </nav>

    <!-- Mobile Menu Button -->
    <button class="rfs-menu-btn" id="rfsMenuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="rfsMobileNav" type="button">
      <div class="rfs-menu-icon" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </button>
  </div>

  <!-- Mobile Dropdown Navigation -->
  <nav class="rfs-mobile-nav" id="rfsMobileNav" aria-label="Mobile">
    <div class="rfs-mobile-nav__inner">
      <a href="#home" class="active">Home</a>
      <a href="#map">Map</a>
      <a href="#bags-of-smile">Bags of Smile</a>
      <a href="#partners">Partners</a>
      <a href="#sponsors">Sponsors</a>
      <a href="#" class="btn-ticket">Get Ticket Now</a>
    </div>
  </nav>
</header>

<script>
(function(){
  const header = document.getElementById("rfsHeader");
  const btn = document.getElementById("rfsMenuBtn");
  const mobileNav = document.getElementById("rfsMobileNav");

  // Shadow on scroll
  window.addEventListener("scroll", () => {
    if (window.scrollY > 10) header.classList.add("scrolled");
    else header.classList.remove("scrolled");
  });

  // Toggle mobile menu
  function setMenu(open){
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    mobileNav.classList.toggle("open", open);
  }

  btn.addEventListener("click", () => {
    const isOpen = btn.getAttribute("aria-expanded") === "true";
    setMenu(!isOpen);
  });

  // Close menu when clicking a link (items still work normally)
  mobileNav.addEventListener("click", (e) => {
    const link = e.target.closest("a");
    if (link) setMenu(false);
  });

  // Close menu on ESC
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setMenu(false);
  });

  // If resizing to desktop, close mobile menu
  window.addEventListener("resize", () => {
    if (window.innerWidth > 768) setMenu(false);
  });
})();
</script>
