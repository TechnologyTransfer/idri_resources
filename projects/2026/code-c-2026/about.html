<script>
  const about_section_data = [
    {
      description:
        "Since 2022, CODE-C has grown into one of the most influential developer conferences and tech expos.",
      main_image:
        "https://www.idri.edu.kh/wp-content/uploads/2026/09/about-us-1-scaled.webp"
    },
    {
      description:
        "Since 2022, CODE-C has grown into one of the most influential developer conferences and tech expos.",
      main_image:
        "https://www.idri.edu.kh/wp-content/uploads/2026/09/about-us-2-scaled.webp"
    },
    {
      description:
        "Since 2022, CODE-C has grown into one of the most influential developer conferences and tech expos.",
      main_image:
        "https://www.idri.edu.kh/wp-content/uploads/2026/09/about-us-3-scaled.webp"
    },
    {
      description:
        "Since 2022, CODE-C has grown into one of the most influential developer conferences and tech expos.",
      main_image:
        "https://www.idri.edu.kh/wp-content/uploads/2026/09/about-us-4-scaled.webp"
    },
    {
      description:
        "Since 2022, CODE-C has grown into one of the most influential developer conferences and tech expos.",
      main_image:
        "https://www.idri.edu.kh/wp-content/uploads/2026/09/about-us-5-scaled.webp"
    },
    {
      description:
        "Since 2022, CODE-C has grown into one of the most influential developer conferences and tech expos.",
      main_image:
        "https://www.idri.edu.kh/wp-content/uploads/2026/09/about-us-6-scaled.webp"
    }
  ];

  const about_section_track =
    document.getElementById(
      "about-section-carousel-track"
    );

  const about_section_viewport =
    document.getElementById(
      "about-section-carousel-viewport"
    );

  const about_section_description =
    document.getElementById(
      "about-section-description"
    );

  const about_section_prev =
    document.getElementById(
      "about-section-prev"
    );

  const about_section_next =
    document.getElementById(
      "about-section-next"
    );

  let about_section_current_slide = 0;
  let about_section_is_animating = false;
  let about_section_move_queue = [];

  let about_section_touch_start_x = 0;
  let about_section_touch_start_y = 0;
  let about_section_touch_end_x = 0;
  let about_section_touch_end_y = 0;

  function about_section_create_slide(slide) {
    return `
      <div class="about-section-slide">
        <div class="about-section-main-image">
          <img
            src="${slide.main_image}"
            alt="Code-C Event"
          >
        </div>
      </div>
    `;
  }

  function about_section_render() {
    about_section_track.innerHTML =
      about_section_data
        .map(function(slide) {
          return about_section_create_slide(slide);
        })
        .join("");

    about_section_current_slide = 0;

    about_section_track.style.transition =
      "none";

    about_section_track.style.transform =
      "translate3d(0, 0, 0)";

    about_section_update_description();
  }

  function about_section_get_step() {
    const about_section_slide =
      about_section_track.querySelector(
        ".about-section-slide"
      );

    if (!about_section_slide) {
      return 0;
    }

    const about_section_style =
      window.getComputedStyle(
        about_section_track
      );

    const about_section_gap =
      parseFloat(
        about_section_style.gap
      ) || 0;

    return (
      about_section_slide.getBoundingClientRect().width +
      about_section_gap
    );
  }

  function about_section_update_description() {
    about_section_description.textContent =
      about_section_data[
        about_section_current_slide
      ].description;
  }

  function about_section_update_position(
    position,
    animate
  ) {
    about_section_track.style.transition =
      animate
        ? "transform 0.5s ease"
        : "none";

    about_section_track.style.transform =
      `translate3d(${position}px, 0, 0)`;
  }

  function about_section_queue_move(direction) {
    about_section_move_queue.push(direction);

    about_section_process_queue();
  }

  function about_section_process_queue() {
    if (about_section_is_animating) {
      return;
    }

    if (
      about_section_move_queue.length === 0
    ) {
      return;
    }

    const about_section_direction =
      about_section_move_queue.shift();

    if (about_section_direction === 1) {
      about_section_move_next();
    } else {
      about_section_move_previous();
    }
  }

  function about_section_move_next() {
    const about_section_step =
      about_section_get_step();

    if (!about_section_step) {
      return;
    }

    about_section_is_animating = true;

    const about_section_first_slide =
      about_section_track.firstElementChild;

    about_section_update_position(
      -about_section_step,
      true
    );

    about_section_current_slide =
      (
        about_section_current_slide + 1
      ) %
      about_section_data.length;

    about_section_update_description();

    const about_section_finish =
      function() {
        about_section_track.removeEventListener(
          "transitionend",
          about_section_finish
        );

        about_section_track.style.transition =
          "none";

        about_section_track.appendChild(
          about_section_first_slide
        );

        about_section_track.style.transform =
          "translate3d(0, 0, 0)";

        about_section_is_animating = false;

        about_section_process_queue();
      };

    about_section_track.addEventListener(
      "transitionend",
      about_section_finish
    );

    setTimeout(
      about_section_finish,
      550
    );
  }

  function about_section_move_previous() {
    const about_section_step =
      about_section_get_step();

    if (!about_section_step) {
      return;
    }

    about_section_is_animating = true;

    const about_section_last_slide =
      about_section_track.lastElementChild;

    about_section_track.style.transition =
      "none";

    about_section_track.insertBefore(
      about_section_last_slide,
      about_section_track.firstElementChild
    );

    about_section_track.style.transform =
      `translate3d(-${about_section_step}px, 0, 0)`;

    about_section_current_slide =
      (
        about_section_current_slide -
        1 +
        about_section_data.length
      ) %
      about_section_data.length;

    about_section_update_description();

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        about_section_update_position(
          0,
          true
        );
      });
    });

    const about_section_finish =
      function() {
        about_section_track.removeEventListener(
          "transitionend",
          about_section_finish
        );

        about_section_track.style.transition =
          "none";

        about_section_track.style.transform =
          "translate3d(0, 0, 0)";

        about_section_is_animating = false;

        about_section_process_queue();
      };

    about_section_track.addEventListener(
      "transitionend",
      about_section_finish
    );

    setTimeout(
      about_section_finish,
      550
    );
  }

  about_section_next.addEventListener(
    "click",
    function() {
      about_section_queue_move(1);
    }
  );

  about_section_prev.addEventListener(
    "click",
    function() {
      about_section_queue_move(-1);
    }
  );

  about_section_viewport.addEventListener(
    "touchstart",
    function(event) {
      if (
        window.innerWidth > 767 &&
        window.matchMedia(
          "(orientation: landscape)"
        ).matches
      ) {
        return;
      }

      about_section_touch_start_x =
        event.touches[0].clientX;

      about_section_touch_start_y =
        event.touches[0].clientY;
    },
    {
      passive: true
    }
  );

  about_section_viewport.addEventListener(
    "touchend",
    function(event) {
      if (
        window.innerWidth > 767 &&
        window.matchMedia(
          "(orientation: landscape)"
        ).matches
      ) {
        return;
      }

      about_section_touch_end_x =
        event.changedTouches[0].clientX;

      about_section_touch_end_y =
        event.changedTouches[0].clientY;

      const about_section_swipe_x =
        about_section_touch_end_x -
        about_section_touch_start_x;

      const about_section_swipe_y =
        about_section_touch_end_y -
        about_section_touch_start_y;

      const about_section_swipe_threshold =
        40;

      if (
        Math.abs(about_section_swipe_x) <=
        Math.abs(about_section_swipe_y)
      ) {
        return;
      }

      if (
        Math.abs(about_section_swipe_x) <
        about_section_swipe_threshold
      ) {
        return;
      }

      if (
        about_section_swipe_x < 0
      ) {
        about_section_queue_move(1);
      }

      if (
        about_section_swipe_x > 0
      ) {
        about_section_queue_move(-1);
      }
    },
    {
      passive: true
    }
  );

  window.addEventListener(
    "resize",
    function() {
      if (about_section_is_animating) {
        return;
      }

      about_section_track.style.transition =
        "none";

      about_section_track.style.transform =
        "translate3d(0, 0, 0)";
    }
  );

  about_section_render();
</script>
