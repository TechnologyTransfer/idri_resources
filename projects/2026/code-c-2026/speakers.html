  .speakers-carousel-viewport {
    width: 92%;
    margin: 0 auto;
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
    overscroll-behavior-x: contain;
  }

  .speakers-carousel-viewport.is-dragging {
    cursor: grabbing;
  }

  .speakers-carousel-track {
    --columns: 3.6;
    --gap: 32px;
    --card-width: 320px;

    display: flex;
    gap: var(--gap);
    width: max-content;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  .speakers-carousel-track.hint-animation {
    animation: speakers-swipe-hint 1.2s ease-in-out;
  }

  @keyframes speakers-swipe-hint {
    0% {
      transform: translate3d(0, 0, 0);
    }

    30% {
      transform: translate3d(42px, 0, 0);
    }

    55% {
      transform: translate3d(42px, 0, 0);
    }

    100% {
      transform: translate3d(0, 0, 0);
    }

<section class="speakers-section">

  <h2 class="speakers-section-title">
    Speakers
  </h2>

  <div
    class="speakers-carousel-viewport"
    id="speakersCarousel"
  >

    <div
      class="speakers-carousel-track"
      id="speakersTrack"
    ></div>

  </div>

</section>

<script>
(function() {

  const speakers = [
    {
      name: "H.E Dr. Khov Makara",
      role: "Secretary of State, Ministry of Post and Telecommunications",
      image: "https://www.idri.edu.kh/wp-content/uploads/2026/09/H.E-Dr.-Khov-Makara.png"
    },

    {
      name: "H.E Dr. Seng Sopheap",
      role: "President, Cambodia Academy of Digital Technology",
      image: "https://www.idri.edu.kh/wp-content/uploads/2026/09/H.E-Dr.-Seng-Sopheap-3.png"
    },

    {
      name: "Dr. Ly Rottana",
      role: "Director of Research & Innovation Center, Cambodia Academy of Digital Technology",
      image: "https://www.idri.edu.kh/wp-content/uploads/2026/09/Dr.-Ly-Rottana.png"
    },

    {
      name: "Dr. Kann Bonpagna",
      role: "Senior Researcher & Lecturer, Cambodia Academy of Digital Technology",
      image: "https://www.idri.edu.kh/wp-content/uploads/2026/09/Dr.-Kann-Bonpagna.png"
    },

    {
      name: "Dr. Va Hongly",
      role: "Senior Researcher & Lecturer, Cambodia Academy of Digital Technology",
      image: "https://www.idri.edu.kh/wp-content/uploads/2026/09/Dr.-Va-Hongly.png"
    },

    {
      name: "Mr. Lay Vathna",
      role: "Senior Researcher & Lecturer, Cambodia Academy of Digital Technology",
      image: "https://www.idri.edu.kh/wp-content/uploads/2026/09/Mr.-Lay-Vathna.png"
    }
  ];


  const viewport =
    document.getElementById("speakersCarousel");

  const track =
    document.getElementById("speakersTrack");

  let isDragging = false;
  let startX = 0;
  let startTranslate = 0;
  let currentTranslate = 0;
  let maxTranslate = 0;
  let hintActive = false;


  function createSpeakerCard(speaker) {

    const card =
      document.createElement("article");

    card.className =
      "speaker-card";

    card.innerHTML = `

      <div class="speaker-card-image-wrapper">

        <img
          class="speaker-card-image"
          src="${speaker.image}"
          alt="${speaker.name}"
          draggable="false"
        >

      </div>

      <div class="speaker-card-info">

        <h3 class="speaker-card-name">
          ${speaker.name}
        </h3>

        <p class="speaker-card-role">
          ${speaker.role}
        </p>

      </div>

    `;

    return card;
  }


  function createSpeakerCards() {

    track.innerHTML = "";

    speakers.forEach(function(speaker) {

      track.appendChild(
        createSpeakerCard(speaker)
      );

    });

  }


  function calculateDimensions() {

    const styles =
      getComputedStyle(track);

    const columns =
      parseFloat(
        styles.getPropertyValue("--columns")
      );

    const gap =
      parseFloat(
        styles.getPropertyValue("--gap")
      );

    const viewportWidth =
      viewport.clientWidth;

    const cardWidth =
      (
        viewportWidth -
        (
          Math.max(
            0,
            Math.floor(columns) - 1
          ) * gap
        )
      ) / columns;

    track.style.setProperty(
      "--card-width",
      cardWidth + "px"
    );

    const totalTrackWidth =
      (
        speakers.length *
        cardWidth
      ) +
      (
        (speakers.length - 1) *
        gap
      );

    maxTranslate =
      Math.max(
        0,
        totalTrackWidth -
        viewportWidth
      );

    currentTranslate =
      Math.max(
        -maxTranslate,
        Math.min(
          0,
          currentTranslate
        )
      );

    setTranslate(
      currentTranslate,
      false
    );

  }


  function setTranslate(
    value,
    animate
  ) {

    const boundedValue =
      Math.max(
        -maxTranslate,
        Math.min(
          0,
          value
        )
      );

    currentTranslate =
      boundedValue;

    track.style.transition =
      animate
        ? "transform 0.35s ease-out"
        : "none";

    track.style.transform =
      "translate3d(" +
      currentTranslate +
      "px, 0, 0)";

  }


  function stopHint() {

    if (!hintActive) {
      return;
    }

    hintActive = false;

    track.classList.remove(
      "hint-animation"
    );

    setTranslate(
      currentTranslate,
      false
    );

  }


  function pointerDown(event) {

    if (
      event.pointerType === "mouse" &&
      event.button !== 0
    ) {
      return;
    }

    stopHint();

    isDragging = true;

    startX =
      event.clientX;

    startTranslate =
      currentTranslate;

    viewport.classList.add(
      "is-dragging"
    );

    track.style.transition =
      "none";

    if (
      viewport.setPointerCapture
    ) {
      viewport.setPointerCapture(
        event.pointerId
      );
    }

  }


  function pointerMove(event) {

    if (!isDragging) {
      return;
    }

    const styles =
      getComputedStyle(track);

    const columns =
      parseFloat(
        styles.getPropertyValue("--columns")
      );

    const gap =
      parseFloat(
        styles.getPropertyValue("--gap")
      );

    const viewportWidth =
      viewport.clientWidth;

    const cardWidth =
      (
        viewportWidth -
        (
          Math.max(
            0,
            Math.floor(columns) - 1
          ) * gap
        )
      ) / columns;

    const totalTrackWidth =
      (
        speakers.length *
        cardWidth
      ) +
      (
        (speakers.length - 1) *
        gap
      );

    const liveMaxTranslate =
      Math.max(
        0,
        totalTrackWidth -
        viewportWidth
      );

    maxTranslate =
      liveMaxTranslate;

    const delta =
      event.clientX -
      startX;

    const nextTranslate =
      startTranslate +
      delta;

    setTranslate(
      nextTranslate,
      false
    );

  }


  function pointerUp(event) {

    if (!isDragging) {
      return;
    }

    isDragging = false;

    viewport.classList.remove(
      "is-dragging"
    );

    if (
      viewport.releasePointerCapture
    ) {

      try {

        viewport.releasePointerCapture(
          event.pointerId
        );

      } catch (error) {}

    }

    setTranslate(
      currentTranslate,
      false
    );

  }


  createSpeakerCards();

  calculateDimensions();


  viewport.addEventListener(
    "pointerdown",
    pointerDown
  );

  viewport.addEventListener(
    "pointermove",
    pointerMove
  );

  viewport.addEventListener(
    "pointerup",
    pointerUp
  );

  viewport.addEventListener(
    "pointercancel",
    pointerUp
  );


  window.addEventListener(
    "resize",
    calculateDimensions
  );


  if (
    "ResizeObserver" in window
  ) {

    const observer =
      new ResizeObserver(
        calculateDimensions
      );

    observer.observe(
      viewport
    );

  }


  setTimeout(function() {

    if (
      currentTranslate === 0 &&
      !isDragging
    ) {

      hintActive = true;

      track.classList.add(
        "hint-animation"
      );

      setTimeout(function() {

        if (hintActive) {

          hintActive = false;

          track.classList.remove(
            "hint-animation"
          );

          setTranslate(
            currentTranslate,
            false
          );

        }

      }, 1250);

    }

  }, 700);

})();
</script>
