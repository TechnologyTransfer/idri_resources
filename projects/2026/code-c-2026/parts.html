<script>
  document.addEventListener("DOMContentLoaded", function () {
    const section = document.querySelector(".parts_of_code_c");

    if (!section) return;

    const tabsContainer = section.querySelector(".parts_of_code_c_tabs");
    const contentContainer = section.querySelector(".parts_of_code_c_content");

    const partsData = [
      {
        title: "Learn Directly from the Experts<br>Across Many Industries",
        description: "Go beyond high-level talks. CODE-C Masterclasses deliver hands-on, expert-led technical deep dives into AI engineering, cloud architecture, cybersecurity, and advanced software design. Designed for active builders looking to level up.",
        filledIcon: "https://www.idri.edu.kh/wp-content/uploads/2026/09/speaker_filled_icon.png",
        outlinedIcon: "https://www.idri.edu.kh/wp-content/uploads/2026/09/speaker_outlined_icon.png",
        background: "https://www.idri.edu.kh/wp-content/uploads/2026/09/speakers_ref_image-1-scaled.webp",
        button1: "Contact Us",
        button2: "Become Speaker",
        button1Url: "https://t.me/PanharithIn",
        button2Url: "https://forms.cloud.microsoft/r/6VDp1kctze"
      },
      {
        title: "Powering Cambodia's Tech Ecosystem Under One Roof",
        description: "CODE-C brings together global tech giants, high-growth startups, policymakers, and thousands of rising developers under one roof. From national infastructure disscussions to grassroots developer tools, this is where Cambodia's digital movement happens. Become part of an ecosystem driving real technological adoption and talent growth.",
        filledIcon: "https://www.idri.edu.kh/wp-content/uploads/2026/09/sponsor_filled_icon.png",
        outlinedIcon: "https://www.idri.edu.kh/wp-content/uploads/2026/09/sponsor_outlined_icon.png",
        background: "https://www.idri.edu.kh/wp-content/uploads/2026/09/become_sponsor-scaled.webp",
        button1: "Contact Us",
        button2: "Become Sponsor",
        button1Url: "https://t.me/ChantraBE",
        button2Url: "#sponsor"
      },
      {
        title: "Cambodia's Largest Tech Gathering",
        description: "Join 3,000+ tech professionals, explore 50+ interactive brand exhibition, and connect with industry leaders, fast-growth startups, and top-tier talent all on one massive floor.",
        filledIcon: "https://www.idri.edu.kh/wp-content/uploads/2026/09/exhibitor_fill_icon.png",
        outlinedIcon: "https://www.idri.edu.kh/wp-content/uploads/2026/09/exhibitor_outlined_icon.png",
        background: "https://www.idri.edu.kh/wp-content/uploads/2026/09/request_booth-scaled.webp",
        button1: "Contact Us",
        button2: "Request Booth",
        button1Url: "https://t.me/ChantraBE",
        button2Url: "https://forms.cloud.microsoft/r/KBLKatXmxv"
      }
    ];

    function createArrow() {
      return `

          <svg viewBox="0 0 24 24">
            <path d="M4 12h15"></path>
            <path d="m13 5 7 7-7 7"></path>
          </svg>
        </span>
      `;
    }

    partsData.forEach(function (item, index) {
      const tab = document.createElement("button");

      tab.className =
        "parts_of_code_c_tab" +
        (index === 0 ? " active" : "");

      tab.type = "button";
      tab.role = "tab";
      tab.setAttribute(
        "aria-selected",
        index === 0 ? "true" : "false"
      );
      tab.setAttribute(
        "data-tab",
        index
      );

      tab.innerHTML = `
        <img
          class="parts_of_code_c_icon parts_of_code_c_icon_filled"
          src="${item.filledIcon}"
          alt=""
        >

        <img
          class="parts_of_code_c_icon parts_of_code_c_icon_outlined"
          src="${item.outlinedIcon}"
          alt=""
        >
      `;

      tabsContainer.appendChild(tab);

      const panel = document.createElement("div");

      panel.className =
        "parts_of_code_c_panel" +
        (index === 0 ? " active" : "");

      panel.setAttribute(
        "data-panel",
        index
      );

      panel.setAttribute(
        "role",
        "tabpanel"

      panel.innerHTML = `
        <div
          class="parts_of_code_c_background"
          style="background-image: url('${item.background}');"
        ></div>

        <div class="parts_of_code_c_content_inner">

          <p class="parts_of_code_c_description">
            ${item.description}
          </p>

          <div class="parts_of_code_c_buttons">

            <a
              target="_blank"
              href="${item.button1Url}"
              class="parts_of_code_c_button parts_of_code_c_button_agenda"

                  ${item.button1}
                </span>

                ${createArrow()}

            <a
              target="_blank"
              href="${item.button2Url}"
              class="parts_of_code_c_button parts_of_code_c_button_register"
            >

              <span class="parts_of_code_c_button_register_inner">

                <span class="parts_of_code_c_button_text">
                  ${item.button2}
                </span>

                ${createArrow()}

              </span>

            </a>

          </div>

        </div>
      `;

      contentContainer.appendChild(panel);
    });

    const tabs =
      section.querySelectorAll(
        ".parts_of_code_c_tab"
      );

    const panels =
      section.querySelectorAll(
        ".parts_of_code_c_panel"
      );

    tabs.forEach(function (tab) {
      tab.addEventListener(
        "click",
        function () {
          const target =
            this.getAttribute(
              "data-tab"
            );

          tabs.forEach(function (item) {
            item.classList.remove(
              "active"
            );

            item.setAttribute(
              "aria-selected",
              "false"
            );
          });

          panels.forEach(function (panel) {
            panel.classList.remove(
              "active"
            );
          });

          this.classList.add(
            "active"
          );

          this.setAttribute(
            "aria-selected",
            "true"
          );

          const targetPanel =
            section.querySelector(
              '.parts_of_code_c_panel[data-panel="' +
              target +
              '"]'
            );

          if (targetPanel) {
            targetPanel.classList.add(
              "active"
            );
          }
        }
      );
    });
  });
</script>
