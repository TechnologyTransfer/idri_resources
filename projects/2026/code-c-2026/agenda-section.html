<style>
  .agenda-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    
  }

  .agenda {
    width: 100vw;
    max-width: 80%;
    color: #15284C;
  }

  .agenda-title {
    text-align: center;
    color: #685AFF;
    margin: 0 0 32px;
    font-size: 52px;
    line-height: 1.2;
    font-weight: 700;
  }

  .agenda-days {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .agenda-day-button {
    width: 100%;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #685AFF;
    background: transparent;
    color: #685AFF;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .agenda-day-button:hover {
    opacity: 0.85;
  }

  .agenda-day-button.is-active {
    background: #685AFF;
    color: #ffffff;
  }

  .agenda-calendar-icon {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .agenda-calendar-icon svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
  }

  .agenda-filter {
    padding: 22px 20px 24px;
    border: 1px solid #9CCFFF;
    margin-bottom: 28px;
  }

  .agenda-filter-header {
    width: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .agenda-filter-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .agenda-filter-title h3 {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    color: #15284C;
    font-size: 22px;
    line-height: 1;
    font-weight: 700;
  }

  .agenda-filter-icon {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #15284C;
  }

  .agenda-filter-icon svg {
    width: 28px;
    height: 28px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
  }

  .agenda-filter-arrow {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
  }

  .agenda-filter-arrow img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .agenda-filter.is-closed .agenda-filter-arrow {
    transform: rotate(180deg);
  }

  .agenda-filter-content {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #9CCFFF;
  }

  .agenda-filter.is-closed .agenda-filter-content {
    display: none;
  }

  .agenda-filter-group {
    margin-bottom: 24px;
  }

  .agenda-filter-group:last-child {
    margin-bottom: 0;
  }

  .agenda-filter-group-title {
    margin: 0 0 14px;
    color: #15284C;
    font-size: 20px;
    font-weight: 700;
  }

  .agenda-filter-options {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .agenda-filter-button {
    padding: 10px 16px;
    border: 1px solid #685AFF;
    border-radius: 50px;
    background: transparent;
    color: #15284C;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .agenda-filter-button:hover {
    background: #685AFF;
    color: #ffffff;
  }

  .agenda-filter-button.is-active {
    background: #685AFF;
    color: #ffffff;
  }

  .agenda-session-count {
    margin: 0 0 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ACACAC;
    color: #ACACAC;
    font-size: 16px;
  }

  .agenda-sessions {
    width: 100%;
  }

  .agenda-session {
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 20px;
    padding: 26px 0;
    border-bottom: 1px solid #ACACAC;
  }

  .agenda-session-time {
    color: #685AFF;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 700;
  }

  .agenda-session-content {
    min-width: 0;
  }

  .agenda-session-title {
    margin: 0 0 14px;
    color: #15284C;
    font-size: 19px;
    line-height: 1.5;
    font-weight: 700;
  }

  .agenda-session-continue {
    color: #9CCFFF;
  }

  .agenda-session-speakers {
    margin-bottom: 16px;
  }

  .agenda-session-speaker {
    margin: 0 0 5px;
    color: #15284C;
    font-size: 17px;
    line-height: 1.5;
  }

  .agenda-session-speaker strong {
    font-weight: 700;
  }

  .agenda-session-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .agenda-tag {
    padding: 6px 11px;
    font-size: 13px;
    line-height: 1;
    font-weight: 600;
  }

  .agenda-tag-type {
    background: #F0FFC3;
    color: #15284C;
  }

  .agenda-tag-topic {
    background: #9CCFFF;
    color: #15284C;
  }

  .agenda-tag-room {
    background: #FF5B5B;
    color: #ffffff;
  }

  .agenda-empty {
    padding: 50px 20px;
    text-align: center;
    border-bottom: 1px solid #ACACAC;
    color: #ACACAC;
    font-size: 18px;
  }

  @media (max-width: 1024px) {
    .agenda {
      max-width: 90%;
    }

    .agenda-title {
      font-size: 52px;
    }

    .agenda-session {
      grid-template-columns: 180px 1fr;
    }
  }

  @media (max-width: 760px) {
    .agenda {
      max-width: 95%;
    }

    .agenda-title {
      margin-bottom: 24px;
      font-size: 42px;
    }

    .agenda-days {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .agenda-day-button {
      padding: 16px;
      font-size: 18px;
    }

    .agenda-filter {
      padding: 16px;
    }

    .agenda-filter-header {
      min-height: 28px;
    }

    .agenda-filter-title {
      gap: 12px;
    }

    .agenda-filter-title h3 {
      font-size: 18px;
    }

    .agenda-filter-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    .agenda-filter-icon svg {
      width: 24px;
      height: 24px;
    }

    .agenda-filter-arrow {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    .agenda-filter-content {
      padding: 16px;
    }

    .agenda-filter-group-title {
      font-size: 18px;
    }

    .agenda-filter-button {
      padding: 9px 13px;
      font-size: 14px;
    }

    .agenda-session {
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 22px 0;
    }

    .agenda-session-time {
      font-size: 16px;
    }

    .agenda-session-title {
      margin-bottom: 12px;
      font-size: 17px;
    }

    .agenda-session-speaker {
      font-size: 15px;
    }
  }

  @media (max-width: 425px) {
    .agenda {
      max-width: 100%;
    }

    .agenda-title {
      font-size: 36px;
    }

    .agenda-day-button {
      font-size: 16px;
    }

    .agenda-filter-title {
      gap: 10px;
    }

    .agenda-filter-title h3 {
      font-size: 17px;
    }

    .agenda-filter-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
    }

    .agenda-filter-icon svg {
      width: 22px;
      height: 22px;
    }

    .agenda-filter-arrow {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
    }

    .agenda-filter-options {
      gap: 8px;
    }

    .agenda-filter-button {
      font-size: 13px;
    }
  }
</style>

      <div
        class="agenda-filter-header"
        id="agenda-filter-header"
      >

        <div class="agenda-filter-title">

          <div class="agenda-filter-icon">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h10"></path>
              <path d="M18 6h2"></path>
              <circle cx="16" cy="6" r="2"></circle>

              <path d="M4 12h4"></path>
              <path d="M12 12h8"></path>

              <path d="M4 18h10"></path>

<script>
  const agenda_data = [
    {
      id: "day-1",
      label: "Day 1 - 21 October, 2026",
      sessions: [
        {
          time: "9:10 AM - 9:20 AM",
          title: "Opening Remarks",
          speakers: [
            {
              name: "H.E. Dr. Seng Sopheap",
              position: "President, Cambodia Academy of Digital Technology (CADT)"
            }
          ],
          type: "Remarks",
          topic: "Agentic AI",
          room: "Cosmos Hall"
        },
        {
          time: "9:20 AM - 10:20 AM",
          title: "The path of developing Khmer Text-to-Speech: Sarika",
          speakers: [
            {
              name: "Mr. Seanghay Yath",
              position: "Front-End Team Lead, Digital Government Committee"
            }
          ],
          type: "Remarks",
          topic: "Agentic AI",
          room: "Jupiter"
        },
        {
          time: "11:10 AM - 12:20 PM",
          title: "Document Extraction Using Generative AI",
          speakers: [
            {
              name: "Dr. Hongly Va",
              position: "Senior Lecturer Researcher, CADT"
            },
            {
              name: "Mr. Mengchhuong Ang",
              position: "Program Coordinator and Lecturer Researcher, CADT"
            }
          ],
          type: "Masterclass",
          topic: "Agentic AI",
          room: "Unicorn"
        },
        {
          time: "1:10 PM - 2:20 PM",
          title: "Document Extraction Using Generative AI",
          continues: true,
          speakers: [
            {
              name: "Dr. Hongly Va",
              position: "Senior Lecturer Researcher, CADT"
            },
            {
              name: "Mr. Mengchhuong Ang",
              position: "Program Coordinator and Lecturer Researcher, CADT"
            }
          ],
          type: "Masterclass",
          topic: "Agentic AI",
          room: "Jupiter"
        },
        {
          time: "2:20 PM - 2:30 PM",
          title: "AI in practice: How to Build Your First AI Model (Tools and Methodologies to build a simple AI model) - using AI tools",
          speakers: [
            {
              name: "Mr. Bonpagna Kann",
              position: "PhD Candidate and Lecturer in AI"
            },
            {
              name: "Mr. Natt Korat",
              position: "AI Assistant Researcher, CADT"
            },
            {
              name: "Ms. Sokchovy Monirath",
              position: "AI Assistant Researcher, CADT"
            }
          ],
          type: "Masterclass",
          topic: "Agentic AI",
          room: "Cosmos Hall"
        },
        {
          time: "2:30 PM - 3:15 PM",
          title: "Prompt Engineering vs. Context Engineering",
          speakers: [
            {
              name: "Mr. Vathna Lay",
              position: "Senior Lecturer-Researcher, CADT"
            },
            {
              name: "Mr. Natt Korat",
              position: "AI Assistant Researcher, CADT"
            },
            {
              name: "Ms. Sokchovy Monirath",
              position: "AI Assistant Researcher, CADT"
            }
          ],
          type: "Workshop",
          topic: "Agentic AI",
          room: "Unicorn"
        },
        {
          time: "4:15 PM - 5:00 PM",
          title: "Mastering Effective Techniques of Khmer Data Collection for High-Quality AI Models",
          speakers: [
            {
              name: "Mr. Seanghort Born",
              position: "PhD Candidate and Lecturer in AI"
            }
          ],
          type: "Workshop",
          topic: "Agentic AI",
          room: "Unicorn"
        }
      ]
    },
    {
      id: "day-2",
      label: "Day 2 - 22 October, 2026",
      sessions: [
        {
          time: "9:00 AM - 9:45 AM",
          title: "AI Computing Infrastructure for the Future",
          speakers: [
            {
              name: "Guest Speaker",
              position: "AI Infrastructure Specialist"
            }
          ],
          type: "Keynote",
          topic: "AI Computing Infrastructure",
          room: "Cosmos Hall"
        },
        {
          time: "10:00 AM - 11:00 AM",
          title: "Building Intelligent Systems with Physical AI",
          speakers: [
            {
              name: "Guest Speaker",
              position: "AI Researcher"
            }
          ],
          type: "Masterclass",
          topic: "Physical AI",
          room: "Jupiter"
        },
        {
          time: "11:15 AM - 12:00 PM",
          title: "AI for Sustainable Development",
          speakers: [
            {
              name: "Guest Speaker",
              position: "Technology and Development Specialist"
            }
          ],
          type: "Workshop",
          topic: "AI for Development",
          room: "Saturn Area"
        },
        {
          time: "1:30 PM - 2:30 PM",
          title: "AI for Modern Software Development",
          speakers: [
            {
              name: "Guest Speaker",
              position: "Software Engineering Specialist"
            }
          ],
          type: "Masterclass",
          topic: "AI for Software Development",
          room: "Unicorn"
        },
        {
          time: "3:00 PM - 4:00 PM",
          title: "Exploring Open Models and AI Ecosystems",
          speakers: [
            {
              name: "Guest Speaker",
              position: "AI Research Specialist"
            }
          ],
          type: "Workshop",
          topic: "Open Model",
          room: "Cosmos Hall"
        }
      ]
    }
  ];

  const agenda_days_container =
    document.getElementById("agenda-days");

  const agenda_topic_container =
    document.getElementById("agenda-topic-filters");

  const agenda_room_container =
    document.getElementById("agenda-room-filters");

  const agenda_sessions_container =
    document.getElementById("agenda-sessions");

  const agenda_session_count =
    document.getElementById("agenda-session-count");

  const agenda_filter =
    document.querySelector(".agenda-filter");

  const agenda_filter_header =
    document.getElementById("agenda-filter-header");

  let agenda_current_day =
    agenda_data[0].id;

  let agenda_current_topic =
    "all";

  let agenda_current_room =
    "all";

  function get_current_day() {
    return agenda_data.find(function(day) {
      return day.id === agenda_current_day;
    });
  }

  function get_unique_topics() {
    const agenda_current_day_data =
      get_current_day();

    return [
      ...new Set(
        agenda_current_day_data.sessions.map(
          function(session) {
            return session.topic;
          }
        )
      )
    ];
  }

  function get_unique_rooms() {
    const agenda_current_day_data =
      get_current_day();

    return [
      ...new Set(
        agenda_current_day_data.sessions.map(
          function(session) {
            return session.room;
          }
        )
      )
    ];
  }

  function render_day_tabs() {
    agenda_days_container.innerHTML =
      agenda_data.map(function(day) {

        const agenda_active_class =
          day.id === agenda_current_day
            ? "is-active"
            : "";

        return `
          <button
            type="button"
            class="agenda-day-button ${agenda_active_class}"
            data-day="${day.id}"
          >
            <span>${day.label}</span>

            <span class="agenda-calendar-icon">
              <svg viewBox="0 0 24 24">
                <path d="M7 2v3"></path>
                <path d="M17 2v3"></path>
                <path d="M3.5 9h17"></path>
                <path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 5 5Z"></path>
                <path d="M8 12h2"></path>
                <path d="M14 12h2"></path>
                <path d="M8 16h2"></path>
                <path d="M14 16h2"></path>
              </svg>
            </span>
          </button>
        `;

      }).join("");
  }

  function render_topic_filters() {
    const agenda_topics =
      get_unique_topics();

    agenda_topic_container.innerHTML = `
      <button
        type="button"
        class="agenda-filter-button ${
          agenda_current_topic === "all"
            ? "is-active"
            : ""
        }"
        data-filter-type="topic"
        data-filter-value="all"
      >
        All
      </button>

      ${agenda_topics.map(function(topic) {

        return `
          <button
            type="button"
            class="agenda-filter-button ${
              agenda_current_topic === topic
                ? "is-active"
                : ""
            }"
            data-filter-type="topic"
            data-filter-value="${topic}"
          >
            ${topic}
          </button>
        `;

      }).join("")}
    `;
  }

  function render_room_filters() {
    const agenda_rooms =
      get_unique_rooms();

    agenda_room_container.innerHTML = `
      <button
        type="button"
        class="agenda-filter-button ${
          agenda_current_room === "all"
            ? "is-active"
            : ""
        }"
        data-filter-type="room"
        data-filter-value="all"
      >
        All
      </button>

      ${agenda_rooms.map(function(room) {

        return `
          <button
            type="button"
            class="agenda-filter-button ${
              agenda_current_room === room
                ? "is-active"
                : ""
            }"
            data-filter-type="room"
            data-filter-value="${room}"
          >
            ${room}
          </button>
        `;

      }).join("")}
    `;
  }

  function get_filtered_sessions() {
    const agenda_current_day_data =
      get_current_day();

    return agenda_current_day_data.sessions.filter(
      function(session) {

        const agenda_topic_match =
          agenda_current_topic === "all" ||
          session.topic === agenda_current_topic;

        const agenda_room_match =
          agenda_current_room === "all" ||
          session.room === agenda_current_room;

        return agenda_topic_match &&
          agenda_room_match;

      }
    );
  }

  function render_sessions() {
    const agenda_filtered_sessions =
      get_filtered_sessions();

    const agenda_count_text =
      agenda_filtered_sessions.length === 1
        ? "1 session found"
        : `${agenda_filtered_sessions.length} sessions found`;

    agenda_session_count.textContent =
      agenda_count_text;

    if (agenda_filtered_sessions.length === 0) {

      agenda_sessions_container.innerHTML = `
        <div class="agenda-empty">
          No sessions found for this filter.
        </div>
      `;

      return;
    }

    agenda_sessions_container.innerHTML =
      agenda_filtered_sessions.map(function(session) {

        const agenda_speakers_html =
          session.speakers.map(function(speaker) {

            return `
              <p class="agenda-session-speaker">
                <strong>${speaker.name}</strong>,
                ${speaker.position}
              </p>
            `;

          }).join("");

        const agenda_continue_html =
          session.continues
            ? `
              <span class="agenda-session-continue">
                (Continues)
              </span>
            `
            : "";

        return `
          <article class="agenda-session">

            <div class="agenda-session-time">
              ${session.time}
            </div>

            <div class="agenda-session-content">

              <h3 class="agenda-session-title">
                ${session.title}
                ${agenda_continue_html}
              </h3>

              <div class="agenda-session-speakers">
                ${agenda_speakers_html}
              </div>

              <div class="agenda-session-tags">

                <span class="agenda-tag agenda-tag-type">
                  ${session.type}
                </span>

                <span class="agenda-tag agenda-tag-topic">
                  ${session.topic}
                </span>

                <span class="agenda-tag agenda-tag-room">
                  ${session.room}
                </span>

              </div>

            </div>

          </article>
        `;

      }).join("");
  }

  function render_agenda() {
    render_day_tabs();
    render_topic_filters();
    render_room_filters();
    render_sessions();
  }

  document.addEventListener(
    "click",
    function(event) {

      const agenda_day_button =
        event.target.closest(".agenda-day-button");

      const agenda_filter_button =
        event.target.closest(".agenda-filter-button");

      if (agenda_day_button) {

        agenda_current_day =
          agenda_day_button.getAttribute("data-day");

        agenda_current_topic =
          "all";

        agenda_current_room =
          "all";

        render_agenda();
      }

      if (agenda_filter_button) {

        const agenda_filter_type =
          agenda_filter_button.getAttribute(
            "data-filter-type"
          );

        const agenda_filter_value =
          agenda_filter_button.getAttribute(
            "data-filter-value"
          );

        if (agenda_filter_type === "topic") {
          agenda_current_topic =
            agenda_filter_value;
        }

        if (agenda_filter_type === "room") {
          agenda_current_room =
            agenda_filter_value;
        }

        render_agenda();
      }

    }
  );

  agenda_filter_header.addEventListener(
    "click",
    function() {

      agenda_filter.classList.toggle(
        "is-closed"
      );

    }
  );

  render_agenda();
</script>
