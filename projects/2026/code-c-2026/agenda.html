  void agenda_session_count.offsetWidth;

  agenda_session_count.style.animation =
    "agendaCountIn 0.5s ease forwards";

  if (
    agenda_filtered_sessions.length === 0
  ) {

    agenda_sessions_container.innerHTML = `

      <div class="agenda-empty">
        No sessions found for this filter.
      </div>

    `;

    return;

  }

  agenda_sessions_container.innerHTML =
    agenda_filtered_sessions.map(
      function(session, index) {

        const agenda_speakers_html =
          session.speakers.map(
            function(speaker) {

              return `
                <p class="agenda-session-speaker">

                  <strong>
                    ${speaker.name}
                  </strong>,

                  ${speaker.position}

                </p>
              `;

            }
          ).join("");

        const agenda_continue_html =
          session.continues
            ? `
              <span class="agenda-session-continue">
                (Continues)
              </span>
            `
            : "";

        return `
          <article
            class="agenda-session"
            style="animation-delay: ${index * 0.07}s"
          >

            <div class="agenda-session-time">
              ${session.time}
            </div>

            <div class="agenda-session-content">

              <h3 class="agenda-session-title">

                ${session.title}

                ${agenda_continue_html}

              </h3>

              <div class="agenda-session-speakers">

                ${agenda_speakers_html}

              </div>

              <div class="agenda-session-tags">

                <span class="agenda-tag agenda-tag-type">
                  ${session.type}
                </span>

                <span class="agenda-tag agenda-tag-topic">
                  ${session.topic}
                </span>

                <button
                  type="button"
                  class="agenda-tag agenda-tag-room"
                  data-room="${session.room}"
                  aria-label="View ${session.room} room information"
                >
                  ${session.room}
                </button>

              </div>

            </div>

          </article>
        `;

      }
    ).join("");

}

function render_agenda() {

  render_day_tabs();
  render_topic_filters();
  render_room_filters();
  render_sessions();

}

function preload_agenda_room_images() {

  Object.values(agenda_room_data).forEach(
    function(room) {

      const agenda_preload_image =
        new Image();

      agenda_preload_image.src =
        room.image;

    }
  );

}

function open_room_popup(room_name) {

  const room =
    agenda_room_data[room_name];

  if (!room) {
    return;
  }

  agenda_room_popup_title.textContent =
    room_name;

  agenda_room_popup_image.classList.remove(
    "is-loaded",
    "is-error"
  );

  agenda_room_popup_image_skeleton.classList.remove(
    "is-hidden"
  );

  agenda_room_popup_image.removeAttribute(
    "src"
  );

  agenda_room_popup_image.alt =
    room_name;

  agenda_room_popup_location.innerHTML =
    `<strong>Location:</strong> ${room.location}`;

  agenda_room_popup.classList.add(
    "is-open"
  );

  agenda_room_popup.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.classList.add(
    "agenda-popup-open"
  );

  const agenda_room_image_loader =
    new Image();

  agenda_room_image_loader.onload =
    function() {

      agenda_room_popup_image.src =
        room.image;

      agenda_room_popup_image.classList.add(
        "is-loaded"
      );

      agenda_room_popup_image_skeleton.classList.add(
        "is-hidden"
      );

    };

  agenda_room_image_loader.onerror =
    function() {

      agenda_room_popup_image.classList.add(
        "is-error"
      );

      agenda_room_popup_image_skeleton.classList.add(
        "is-hidden"
      );

    };

  agenda_room_image_loader.src =
    room.image;

  setTimeout(
    function() {

      agenda_room_popup_close.focus();

    },
    50
  );

}

function close_room_popup() {

  agenda_room_popup.classList.remove(
    "is-open"
  );

  agenda_room_popup.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.classList.remove(
    "agenda-popup-open"
  );

}

document.addEventListener(
  "click",
  function(event) {

    const agenda_day_button =
      event.target.closest(
        ".agenda-day-button"
      );

    const agenda_filter_button =
      event.target.closest(
        ".agenda-filter-button"
      );

    const agenda_room_button =
      event.target.closest(
        ".agenda-tag-room"
      );

    if (agenda_room_button) {

      event.preventDefault();
      event.stopPropagation();

      const room_name =
        agenda_room_button.getAttribute(
          "data-room"
        );

      open_room_popup(
        room_name
      );

      return;

    }

    if (agenda_day_button) {

      agenda_current_day =
        agenda_day_button.getAttribute(
          "data-day"
        );

      agenda_current_topic =
        "all";

      agenda_current_room =
        "all";

      render_agenda();

    }

    if (agenda_filter_button) {

      const agenda_filter_type =
        agenda_filter_button.getAttribute(
          "data-filter-type"
        );

      const agenda_filter_value =
        agenda_filter_button.getAttribute(
          "data-filter-value"
        );

      if (
        agenda_filter_type ===
        "topic"
      ) {

        agenda_current_topic =
          agenda_filter_value;

      }

      if (
        agenda_filter_type ===
        "room"
      ) {

        agenda_current_room =
          agenda_filter_value;

      }

      render_agenda();

    }

  }
);

agenda_filter_header.addEventListener(
  "click",
  function() {

    agenda_filter.classList.toggle(
      "is-closed"
    );

  }
);

agenda_room_popup_close.addEventListener(
  "click",
  function() {

    close_room_popup();

  }
);

agenda_room_popup.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      agenda_room_popup
    ) {

      close_room_popup();

    }

  }
);

agenda_room_popup_card.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

  }
);

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape" &&
      agenda_room_popup.classList.contains(
        "is-open"
      )
    ) {

      close_room_popup();

    }

  }
);

render_agenda();

window.addEventListener(
  "load",
  function() {

    preload_agenda_room_images();

  }
);

</script>
