<style>
  .about-section-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    background: transparent;
  }

  .about-section {
    width: 100vw;
    max-width: 80%;
    color: #15284C;
  }

  .about-section-layout {
    display: grid;
    grid-template-columns: 520px minmax(0, 1fr);
    gap: 40px;
    align-items: center;
    padding: 80px 0;
  }

  .about-section-content {
    width: 100%;
  }

  .about-section-label {
    margin: 0 0 8px;
    color: #15284C;
    font-size: 20px;
    line-height: 1.4;
    font-weight: 400;
  }

  .about-section-title {
    margin: 0 0 8px;
    color: #685AFF;
    font-size: 44px;
    line-height: 1.32;
    font-weight: 700;
    letter-spacing: 0;
  }

  .about-section-description {
    margin: 0;
    max-width: 360px;
    color: #15284C;
    font-size: 17px;
    line-height: 1.45;
    font-weight: 400;
  }

  .about-section-actions {
    margin-top: 20px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
  }

  .about-section-button {
    width: 220px;
    height: 40px;
    padding: 0;
    border: none;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    font-family: inherit;
    cursor: pointer;
    background: transparent;
    transition: opacity 0.25s ease;
  }

  .about-section-button:hover {
    opacity: 0.82;
  }

  .about-section-button-outline {
    background: #685AFF;
    clip-path: polygon(
      12px 0,
      100% 0,
      100% calc(100% - 12px),
      calc(100% - 12px) 100%,
      0 100%,
      0 12px
    );
  }

  .about-section-button-outline-inner {
    position: absolute;
    inset: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    clip-path: polygon(
      11px 0,
      100% 0,
      100% calc(100% - 11px),
      calc(100% - 11px) 100%,
      0 100%,
      0 11px
    );
  }

  .about-section-button-filled {
    background: #685AFF;
    clip-path: polygon(
      12px 0,
      100% 0,
      100% calc(100% - 12px),
      calc(100% - 12px) 100%,
      0 100%,
      0 12px
    );
  }

  .about-section-button-text {
    height: 100%;
    display: flex;
    align-items: center;
    padding-left: 10px;
    padding-right: 6px;
    white-space: nowrap;
    font-size: 12px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.7px;
  }

  .about-section-button-outline
  .about-section-button-text {
    color: #685AFF;
  }

  .about-section-button-filled
  .about-section-button-text {
    color: #ffffff;
  }

  .about-section-button-arrow-box {
    width: 28px;
    height: 28px;
    margin-right: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    clip-path: polygon(
      7px 0,
      100% 0,
      100% calc(100% - 7px),
      calc(100% - 7px) 100%,
      0 100%,
      0 7px
    );
  }

  .about-section-button-outline
  .about-section-button-arrow-box {
    background: #685AFF;
    color: #ffffff;
  }

  .about-section-button-filled
  .about-section-button-arrow-box {
    background: #ffffff;
    color: #685AFF;
  }

  .about-section-button-arrow-box svg {
    width: 20px;
    height: 20px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  .about-section-social {
    margin-top: 110px;
  }

  .about-section-social-title {
    margin: 0;
    color: #15284C;
    font-size: 17px;
    line-height: 1.45;
    font-weight: 400;
  }

  .about-section-social-subtitle {
    margin: 0 0 8px;
    color: #15284C;
    font-size: 17px;
    line-height: 1.45;
    font-weight: 400;
  }

  .about-section-social-links {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .about-section-social-link {
    width: 30px;
    height: 30px;
    display: block;
    background: #ACACAC;
    transition: background 0.25s ease;
  }

  .about-section-social-link:hover {
    background: #685AFF;
  }

  .about-section-carousel {
    width: 100%;
    min-width: 0;
  }

  .about-section-carousel-viewport {
    width: 100%;
    overflow: hidden;
  }

  .about-section-carousel-track {
    width: 100%;
    display: flex;
    gap: 20px;
    transition: transform 0.5s ease;
  }

  .about-section-slide {
    width: calc(100% - 108px);
    min-width: calc(100% - 108px);
    flex-shrink: 0;
  }

  .about-section-main-image {
    width: 100%;
    height: 495px;
    overflow: hidden;
    background: #ACACAC;
    clip-path: polygon(
      8% 0,
      100% 0,
      100% 87%,
      91% 100%,
      0 100%,
      0 11%
    );
  }

  .about-section-main-image img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .about-section-carousel-controls {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }

  .about-section-carousel-button {
    width: 42px;
    height: 42px;
    padding: 0;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #685AFF;
    color: #ffffff;
    cursor: pointer;
    transition: opacity 0.25s ease;
    clip-path: polygon(
      0 0,
      calc(100% - 8px) 0,
      100% 8px,
      100% 100%,
      8px 100%,
      0 calc(100% - 8px)
    );
  }

  .about-section-carousel-button:hover {
    opacity: 0.82;
  }

  .about-section-carousel-button svg {
    width: 25px;
    height: 25px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  @media (max-width: 1200px) {
    .about-section {
      max-width: 90%;
    }

    .about-section-layout {
      grid-template-columns: 310px minmax(0, 1fr);
      gap: 35px;
    }

    .about-section-main-image {
      height: 420px;
    }

    .about-section-slide {
      width: calc(100% - 95px);
      min-width: calc(100% - 95px);
    }
  }

  @media (max-width: 1024px) {
    .about-section-layout {
      grid-template-columns: 1fr;
      gap: 45px;
    }

    .about-section-description {
      max-width: 500px;
    }

    .about-section-social {
      margin-top: 50px;
    }

    .about-section-main-image {
      height: 450px;
    }
  }

  @media (max-width: 760px) {
    .about-section {
      max-width: 95%;
    }

    .about-section-layout {
      padding: 50px 0;
    }

    .about-section-title {
      font-size: 38px;
    }

    .about-section-actions {
      gap: 8px;
      flex-wrap: wrap;
    }

    .about-section-social {
      margin-top: 45px;
    }

    .about-section-main-image {
      height: 360px;
    }

    .about-section-slide {
      width: calc(100% - 77px);
      min-width: calc(100% - 77px);
    }

    .about-section-carousel-track {
      gap: 12px;
    }
  }

  @media (max-width: 560px) {
    .about-section {
      max-width: 100%;
    }

    .about-section-layout {
      padding: 40px 20px;
    }

    .about-section-title {
      font-size: 34px;
    }

    .about-section-description {
      font-size: 16px;
    }

    .about-section-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .about-section-button {
      width: 100%;
      height: 52px;
    }

    .about-section-button-text {
      padding-left: 8px;
      font-size: 14px;
      letter-spacing: 0.45px;
    }

    .about-section-button-arrow-box {
      width: 32px;
      height: 32px;
      margin-right: 12px;
    }

    .about-section-button-arrow-box svg {
      width: 24px;
      height: 24px;
    }

    .about-section-social {
      margin-top: 40px;
    }

    .about-section-main-image {
      height: 280px;
    }

    .about-section-slide {
      width: calc(100% - 65px);
      min-width: calc(100% - 65px);
    }

    .about-section-carousel-track {
      gap: 10px;
    }
  }

  @media (max-width: 425px) {
    .about-section-layout {
      padding: 35px 15px;
    }

    .about-section-label {
      font-size: 16px;
    }

    .about-section-title {
      font-size: 32px;
    }

    .about-section-description {
      font-size: 16px;
    }

    .about-section-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .about-section-button {
      width: 100%;
      height: 52px;
    }

    .about-section-button-text {
      padding-left: 8px;
      font-size: 14px;
      letter-spacing: 0.45px;
    }

    .about-section-button-arrow-box {
      width: 32px;
      height: 32px;
      margin-right: 12px;
    }

    .about-section-button-arrow-box svg {
      width: 24px;
      height: 24px;
    }

    .about-section-main-image {
      height: 220px;
    }

    .about-section-slide {
      width: calc(100% - 53px);
      min-width: calc(100% - 53px);
    }

    .about-section-carousel-track {
      gap: 8px;
    }

    .about-section-carousel-button {
      width: 38px;
      height: 38px;
    }
  }
</style>

<script>
  const about_section_data = [
    {
      description:
        "Since 2022, Code-C has grown into one of the most influential developer conferences and tech expos.",
      main_image: ""
    },
    {
      description:
        "Since 2022, Code-C has grown into one of the most influential developer conferences and tech expos.",
      main_image: ""
    },
    {
      description:
        "Since 2022, Code-C has grown into one of the most influential developer conferences and tech expos.",
      main_image: ""
    }
  ];

  const about_section_track =
    document.getElementById(
      "about-section-carousel-track"
    );

  const about_section_description =
    document.getElementById(
      "about-section-description"
    );

  const about_section_prev =
    document.getElementById(
      "about-section-prev"
    );

  const about_section_next =
    document.getElementById(
      "about-section-next"
    );

  const about_section_next_action =
    document.getElementById(
      "about-section-next-action"
    );

  const about_section_video_button =
    document.getElementById(
      "about-section-video-button"
    );

  let about_section_current_slide = 0;

  function about_section_create_image(
    image_url
  ) {
    if (image_url) {
      return `
        <div class="about-section-main-image">
          <img
            src="${image_url}"
            alt="Code-C Event"
          >
        </div>
      `;
    }

    return `
      <div class="about-section-main-image"></div>
    `;
  }

  function about_section_render() {
    about_section_track.innerHTML =
      about_section_data
        .map(
          function(slide) {

            const about_section_main_image =
              about_section_create_image(
                slide.main_image
              );

            return `
              <div class="about-section-slide">
                ${about_section_main_image}
              </div>
            `;
          }
        )
        .join("");

    about_section_update();
  }

  function about_section_update() {
    const about_section_slide =
      about_section_data[
        about_section_current_slide
      ];

    about_section_description.textContent =
      about_section_slide.description;

    const about_section_slide_element =
      document.querySelector(
        ".about-section-slide"
      );

    if (about_section_slide_element) {
      const about_section_slide_width =
        about_section_slide_element.offsetWidth;

      const about_section_track_style =
        window.getComputedStyle(
          about_section_track
        );

      const about_section_track_gap =
        parseFloat(
          about_section_track_style.gap
        ) || 0;

      about_section_track.style.transform =
        `translateX(-${
          about_section_current_slide *
          (
            about_section_slide_width +
            about_section_track_gap
          )
        }px)`;
    }
  }

  function about_section_next_slide() {
    about_section_current_slide =
      (
        about_section_current_slide + 1
      ) %
      about_section_data.length;

    about_section_update();
  }

  function about_section_prev_slide() {
    about_section_current_slide =
      (
        about_section_current_slide -
        1 +
        about_section_data.length
      ) %
      about_section_data.length;

    about_section_update();
  }

  about_section_next.addEventListener(
    "click",
    function() {
      about_section_next_slide();
    }
  );

  about_section_prev.addEventListener(
    "click",
    function() {
      about_section_prev_slide();
    }
  );

  about_section_next_action.addEventListener(
    "click",
    function() {
      about_section_next_slide();
    }
  );

  about_section_video_button.addEventListener(
    "click",
    function() {
      window.location.href = "#";
    }
  );

  window.addEventListener(
    "resize",
    function() {
      about_section_update();
    }
  );

  about_section_render();
</script>
