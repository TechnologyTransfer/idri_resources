<section class="acet-conference-hero-section">
  <div class="acet-conference-hero-media-wrap"></div>

  <div class="acet-conference-hero-container">
    <div class="acet-conference-hero-content">
      <h1 class="acet-conference-hero-title"></h1>

      <div class="acet-conference-hero-meta">
        <p>
          <span>Date:</span> Nov 12 - 13, 2026
        </p>

        <p>
          <span>Location:</span> Innovation Center, CADT
        </p>
      </div>

      <a
        class="acet-conference-hero-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="acet-conference-hero-button-text"></span>

        <span class="acet-conference-hero-button-arrow">
          >
        </span>
      </a>
    </div>
  </div>
</section>

<style>
  .acet-conference-hero-section {
    width: 100%;
    min-height: 820px;
    position: relative;
    overflow: hidden;
    color: #ffffff;
  }

  .acet-conference-hero-media-wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .acet-conference-hero-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .acet-conference-hero-container {
    width: 100%;
    min-height: 820px;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
  }

  .acet-conference-hero-content {
    width: 100%;
    max-width: 1180px;
    text-align: center;
  }

  .acet-conference-hero-title {
    margin: 0;
    color: #ffffff !important;
    font-size: 64px;
    line-height: 1.18;
    font-weight: 600;
    letter-spacing: 0;
  }

  .acet-conference-hero-meta {
    margin-top: 28px;
  }

  .acet-conference-hero-meta p {
    margin: 4px 0;
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
  }

  .acet-conference-hero-meta span {
    color: #ff4438;
  }

  .acet-conference-hero-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    margin-top: 36px;
    padding: 14px 20px;
    background: #ff4438;
    color: #ffffff !important;
    font-size: 16px;
    line-height: 1;
    font-weight: 600;
    text-decoration: none;
    border: 2px solid #ff4438;
    transition:
      background 220ms ease,
      border-color 220ms ease,
      transform 220ms ease,
      box-shadow 220ms ease;
  }

  .acet-conference-hero-button:hover {
    color: #ffffff !important;
    background: #ff5a4f;
    border-color: #ff5a4f;
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(255, 68, 56, 0.28);
  }

  .acet-conference-hero-button-arrow {
    width: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateX(-8px);
    transition:
      width 220ms ease,
      opacity 220ms ease,
      transform 220ms ease,
      margin-left 220ms ease;
  }

  .acet-conference-hero-button:hover
    .acet-conference-hero-button-arrow {
    width: 14px;
    opacity: 1;
    margin-left: 8px;
    transform: translateX(0);
  }

  .acet-conference-hero-button-hidden {
    display: none;
  }

  @media (max-width: 760px) {
    .acet-conference-hero-section,
    .acet-conference-hero-container {
      min-height: 620px;
    }

    .acet-conference-hero-container {
      padding: 48px 20px;
    }

    .acet-conference-hero-title {
      font-size: 44px;
    }

    .acet-conference-hero-meta p {
      font-size: 18px;
    }

    .acet-conference-hero-button {
      font-size: 16px;
    }
  }

  @media (max-width: 425px) {
    .acet-conference-hero-section,
    .acet-conference-hero-container {
      min-height: 520px;
    }

    .acet-conference-hero-container {
      padding: 36px 16px;
    }

    .acet-conference-hero-title {
      font-size: 30px;
      line-height: 1.25;
    }

    .acet-conference-hero-meta p {
      font-size: 15px;
      line-height: 1.5;
    }

    .acet-conference-hero-button {
      min-height: 46px;
      margin-top: 24px;
      padding: 12px 16px;
      font-size: 14px;
    }
  }
</style>

<script>
  const acetConferenceHeroData = {
    mediaType: "image",
    mediaUrl: "https://www.idri.edu.kh/wp-content/uploads/2026/05/ACET2026-Hero-Bg-1-scaled.png",
    title: "ASEAN Conference<br>on Emerging Technologies 2026",
    buttonText: "Submit Paper",
    buttonUrl: "#submission"
  };

  const acetConferenceHeroSection = document.querySelector(
    ".acet-conference-hero-section"
  );

  function acetConferenceHeroRender(data) {
    const mediaWrap = acetConferenceHeroSection.querySelector(
      ".acet-conference-hero-media-wrap"
    );

    const title = acetConferenceHeroSection.querySelector(
      ".acet-conference-hero-title"
    );

    const button = acetConferenceHeroSection.querySelector(
      ".acet-conference-hero-button"
    );

    const buttonText = acetConferenceHeroSection.querySelector(
      ".acet-conference-hero-button-text"
    );

    mediaWrap.innerHTML = "";

    if (data.mediaType === "video") {
      mediaWrap.innerHTML = `
        <video
          class="acet-conference-hero-media acet-conference-hero-video"
          autoplay
          muted
          loop
          playsinline
          aria-hidden="true"
        >
          <source src="${data.mediaUrl}" type="video/webm">
        </video>
      `;
    } else {
      mediaWrap.innerHTML = `
        <img
          class="acet-conference-hero-media acet-conference-hero-image"
          src="${data.mediaUrl}"
          alt=""
          aria-hidden="true"
        >
      `;
    }

    title.innerHTML = data.title;

    if (data.buttonText) {
      button.classList.remove("acet-conference-hero-button-hidden");
      button.href = data.buttonUrl || "#";
      button.target = "_blank";
      button.rel = "noopener noreferrer";
      buttonText.textContent = data.buttonText;
    } else {
      button.classList.add("acet-conference-hero-button-hidden");
    }
  }

  acetConferenceHeroRender(acetConferenceHeroData);
</script>
